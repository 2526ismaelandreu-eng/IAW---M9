<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Formulario de compra</title>
</head>
<body>

<h1>Finalizar compra</h1>

<form action="#" method="post">

  <h2>Datos personales</h2>
  <p>
    <label for="nombre">Nombre completo:</label><br>
    <input type="text" id="nombre" name="nombre" required>
  </p>
  <p>
    <label for="email">Correo electrónico:</label><br>
    <input type="email" id="email" name="email" required>
  </p>

  <h2>Dirección de envío</h2>
  <p>
    <label for="direccion">Dirección:</label><br>
    <input type="text" id="direccion" name="direccion" required>
  </p>
  <p>
    <label for="ciudad">Ciudad:</label><br>
    <input type="text" id="ciudad" name="ciudad" required>
  </p>
  <p>
    <label for="cp">Código postal:</label><br>
    <input type="text" id="cp" name="cp" required>
  </p>

  <h2>Pedido</h2>
  <p>
    <label for="producto">Producto:</label><br>
    <select id="producto" name="producto">
      <option value="producto1">Producto 1 - 29,90 €</option>
      <option value="producto2">Producto 2 - 49,90 €</option>
      <option value="producto3">Producto 3 - 89,00 €</option>
    </select>
  </p>
  <p>
    <label for="cantidad">Cantidad:</label><br>
    <input type="number" id="cantidad" name="cantidad" value="1" min="1">
  </p>

  <h2>Descuento</h2>
  <p>
    <label for="descuento">Código de descuento:</label><br>
    <input type="text" id="descuento" name="descuento">
  </p>

  <h2>Pago</h2>
  <p>
    <label for="tarjeta">Número de tarjeta:</label><br>
    <input type="text" id="tarjeta" name="tarjeta" maxlength="19" required>
  </p>
  <p>
    <label for="caducidad">Caducidad (MM/AA):</label><br>
    <input type="text" id="caducidad" name="caducidad" maxlength="5" required>
  </p>
